name: Nightly Price Update

on:
  schedule:
    # Run at 2:00 AM UTC every day (7:00 AM PKT)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-prices:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allow the workflow to commit changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pyyaml

      - name: Run price update script
        run: python scripts/update_prices.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/stock_metrics.csv data/raw/stocks/
          git diff --staged --quiet || git commit -m "Nightly price update [skip ci]"
          git push